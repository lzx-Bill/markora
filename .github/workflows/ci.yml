name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      DATABASE_URL: postgresql://markora:markora@127.0.0.1:5432/markora_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: markora_test
          POSTGRES_USER: markora
          POSTGRES_PASSWORD: markora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markora -d markora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: pnpm verify

      - name: Apply migrations to the isolated test database
        run: pnpm db:migrate

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
