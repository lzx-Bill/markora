name: Bug report
description: Report a reproducible problem in Markora
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private Markdown, database dumps, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0-rc.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Local development, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Add browser, OS, request ID, and redacted logs if relevant.
