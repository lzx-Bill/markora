name: markora-development

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: markora
      POSTGRES_USER: markora
      POSTGRES_PASSWORD: markora
    ports:
      - "127.0.0.1:27185:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markora -d markora"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - markora-postgres-data:/var/lib/postgresql

volumes:
  markora-postgres-data:
